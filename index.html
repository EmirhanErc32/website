<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi Butonu</title>
    <style>
        /* Sayfayı ortalamak için (isteğe bağlı) */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fce4ec; /* Açık pembe arka plan */
        }

        /* Butonun stili */
        #sevgiButonu {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #e91e63; /* Canlı pembe */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #sevgiButonu:hover {
            background-color: #c2185b;
        }

        /* Başlangıçta gizli olan mesaj */
        #mesaj {
            display: none; /* Başlangıçta görünmez */
            margin-top: 25px;
            font-size: 28px;
            color: #d81b60; /* Koyu pembe */
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="sevgiButonu">Benim için tıkla!</button>

    <p id="mesaj">❤️ İdil'i çok seviyorum ❤️</p>

    <script>
        // Gerekli HTML elementlerini seç
        const buton = document.getElementById('sevgiButonu');
        const yazi = document.getElementById('mesaj');

        // Butona bir tıklama olayı ekle
        buton.addEventListener('click', function() {
            // Mesajı görünür yap
            yazi.style.display = 'block';
        });
    </script>

</body>
</html>
